<!doctype html><html lang="da"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Byggeværkstedet · Designprøve</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e9e5;color:#28352e;font:15px system-ui,sans-serif}header{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px;flex-wrap:wrap}h1{font-size:16px;margin:0}nav{display:flex;gap:4px}button{font:inherit;padding:10px 15px;border:1px solid #ccc;border-radius:8px;background:#f9f9f5;cursor:pointer}button[aria-pressed=true]{background:#234e38;color:#fff;border-color:#234e38}.stage{display:flex;justify-content:center;padding:0 16px 24px}iframe{width:390px;height:844px;border:0;background:#fffdf7;border-radius:4px;box-shadow:0 5px 30px #0001;max-width:100%}p{text-align:center;font-size:12px;color:#58615c;margin:0 0 14px}@media(max-width:600px){header h1{display:none}.stage{padding:0}iframe{height:calc(100dvh - 112px)}button{font-size:13px}}</style><header><h1>Byggeværkstedet · Prøveversion</h1><nav aria-label="Prøv en skærmstørrelse"><button data-w="390" aria-pressed="true">Mobil</button><button data-w="834" aria-pressed="false">iPad</button><button data-w="1100" aria-pressed="false">Stor skærm</button></nav><a href="index.html" style="color:inherit">Åbn uden ramme</a></header><p>Vælg Børn eller Forældre inde i appen. Den almindelige app er uændret.</p><div class="stage"><iframe id="app" src="index.html" title="Prøv Byggeværkstedet"></iframe></div><script>document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{document.getElementById('app').style.width=b.dataset.w+'px';document.getElementById('app').style.height=b.dataset.w==='834'?'1194px':'844px';document.querySelectorAll('[data-w]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></html>
